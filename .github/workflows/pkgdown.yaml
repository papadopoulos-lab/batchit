on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [published]
  # Lets a pkgdowntemplate change be rolled out here without a dummy commit:
  #   gh workflow run pkgdown.yaml --repo papadopoulos-lab/batchit
  workflow_dispatch:

name: pkgdown

jobs:
  pkgdown:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          # Pinned P3M snapshot -- see the comment in R-CMD-check.yaml.
          # pkgdown loads the batchit namespace (and so qs2) to build the
          # reference index, so it hits the same stringfish failure.
          use-public-rspm: false
          cran: https://packagemanager.posit.co/cran/__linux__/noble/2026-07-23

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgdown, local::.
          needs: website

      - name: Build site
        run: pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE)
        shell: Rscript {0}

      - name: Deploy to GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
