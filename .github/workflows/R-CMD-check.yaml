on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

name: R-CMD-check

jobs:
  R-CMD-check:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      # The seam / production-boundary tests spawn real subprocesses and install a
      # throwaway consumer package; they are skip_on_cran, so NOT_CRAN=true is what
      # makes them RUN under R CMD check (which is the whole point of the check).
      NOT_CRAN: true

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          # stringfish?source: qs2 -> stringfish -> RcppParallel (bundled TBB).
          # P3M's prebuilt stringfish binary references a legacy TBB symbol
          # (tbb::internal::concurrent_vector_base_v3) that the RcppParallel
          # binary currently served no longer exports, so loading stringfish.so
          # fails at dyn.load and every qs2 call dies. Building stringfish from
          # source links it against whatever RcppParallel is actually installed.
          # Drop this once upstream P3M binaries agree again.
          extra-packages: any::rcmdcheck, stringfish?source
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          args: 'c("--no-manual")'
