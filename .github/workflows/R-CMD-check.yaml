on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

name: R-CMD-check

jobs:
  R-CMD-check:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      # The seam / production-boundary tests spawn real subprocesses and install a
      # throwaway consumer package; they are skip_on_cran, so NOT_CRAN=true is what
      # makes them RUN under R CMD check (which is the whole point of the check).
      NOT_CRAN: true

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          # Pin RcppParallel: qs2 -> stringfish -> RcppParallel. RcppParallel
          # 6.1.1 dropped the legacy TBB ABI, but stringfish 0.19.0 still
          # references tbb::internal::concurrent_vector_base_v3, so
          # stringfish.so cannot be dyn.load'ed and every qs2 call dies.
          # 5.1.11.2 is the version this package is developed against, where
          # the identical stringfish/qs2 versions load fine. Rebuilding
          # stringfish from source does NOT fix it (tried: the source build
          # emits the same legacy symbol against RcppParallel 6.1.1 headers),
          # so the version pin is the fix and ?source only guarantees
          # stringfish is linked against the pinned RcppParallel.
          # Drop both once stringfish supports RcppParallel 6.
          extra-packages: any::rcmdcheck, RcppParallel@5.1.11.2, stringfish?source
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          args: 'c("--no-manual")'
