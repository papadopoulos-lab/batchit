on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

name: R-CMD-check

jobs:
  R-CMD-check:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      # The seam / production-boundary tests spawn real subprocesses and install a
      # throwaway consumer package; they are skip_on_cran, so NOT_CRAN=true is what
      # makes them RUN under R CMD check (which is the whole point of the check).
      NOT_CRAN: true

    steps:
      - uses: actions/checkout@v4

      # Needed since 26.7.29: vignettes/ is built and re-rendered by R CMD check.
      # The pkgdown workflow has always had this step; this one had not, because
      # until now the package shipped no vignette.
      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          # Pinned P3M snapshot, NOT "latest". qs2 -> stringfish -> RcppParallel.
          # RcppParallel 6.1.1 no longer exports the legacy TBB symbol
          # tbb::internal::concurrent_vector_base_v3::internal_grow_by, which
          # stringfish 0.19.0 still references, so stringfish.so fails to
          # dyn.load and every qs2 call dies. 2026-07-23 is the last CI-green
          # day; it serves RcppParallel 6.0.0 + stringfish 0.19.0, which is the
          # combination that actually passed. (6.0.0 is fine -- the break is
          # 6.0.0 -> 6.1.1 specifically, not all of 6.x.)
          # Unpin once stringfish ships a release compatible with 6.1.1.
          use-public-rspm: false
          cran: https://packagemanager.posit.co/cran/__linux__/noble/2026-07-23

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          args: 'c("--no-manual")'
