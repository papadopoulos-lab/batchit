url: https://papadopoulos-lab.github.io/batchit/

# House style shared with the other papadopoulos-lab packages (swereg et al).
# The template package supplies bootstrap 5, the typography, the palette, and
# the navbar/footer structure. Everything under `params: hero:` is this
# package's own copy for the home-page hero band. The template picks up
# man/figures/logo.png by itself for the hero's art column; regenerate that
# file with `Rscript dev/logo.R`.
#
# The hero sits above the home-page body, which pkgdown fills from index.md
# (NOT README.md, which is the GitHub landing page and is deliberately thinner).
template:
  package: pkgdowntemplate
  params:
    hero:
      overline: "R package · Parallel subprocess dispatch"
      title: "Run one R function across many worker processes."
      lede: >
        Dispatch one function over many items, each in its own worker process.
        Take the return values back, or let batchit write each item's output
        files, with a guarantee that a failed item never leaves a half-written
        file at its final path.
      cta:
        primary:
          text: "Get started"
          href: "articles/batchit.html"
        secondary:
          text: "Browse the reference →"
          href: "reference/index.html"

authors:
  footer:
    roles: [cre, aut]
    text: "Crafted by"
  sidebar:
    roles: [cre, aut, cph]
  before: "This package is proudly brought to you by:"
  after: "See the [changelog](news/index.html) for other contributors."
  Richard Aubrey White:
    href: "https://www.rwhite.no"

reference:
- title: Dispatch a function across subprocesses
  desc: >
    Run one function over many items, in worker processes: a fresh one per item
    for the first three, a reused pool for the fourth. Each takes `fn`, either a
    `package_function()` descriptor (hash-verified) or a bare closure for all
    but the streaming function. They differ in how each item's data arrives and
    in what comes back, a return value or declared output files that batchit
    stages and then commits.
  contents:
  - run
  - run_and_collect
  - run_and_write_files_atomically
  - stream_from_parent_and_write_files_atomically

- title: Building a dispatch
  desc: >
    Helpers used when constructing a dispatch: name the target function
    (hash-verified against what the worker loads), and, inside a
    `staged_writer` target, resolve where to write a declared output.
  contents:
  - package_function
  - where_to_write_output

- title: Writing one file atomically
  desc: >
    A standalone atomic qs2 writer, usable on its own with no dispatch: it
    writes to a temporary file beside the destination and renames it into
    place, so the destination is never a truncated file. Independent of the
    `run_and_write_files_atomically()` commit engine.
  contents:
  - write_qs2_atomically
